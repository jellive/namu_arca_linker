name: Mutation Testing

on:
  schedule:
    # Weekly, Monday 02:00 UTC (~ Mon 11:00 KST)
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  stryker:
    name: Stryker (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: |
            reports/mutation/
            stryker.log
          retention-days: 14
