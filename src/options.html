<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나무위키 아카링커 설정</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --text-sub: #666666;
      --accent: #4a90d9;
      --danger: #e74c3c;
      --success: #2ecc71;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --surface: #2a2a2a;
        --border: #3a3a3a;
        --text: #f0f0f0;
        --text-sub: #aaaaaa;
        --accent: #5ba3e8;
        --danger: #e74c3c;
        --success: #2ecc71;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .hint {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    #sites-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .site-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .site-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .site-info input {
      width: 100%;
      padding: 6px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      outline: none;
    }

    .site-info input:focus {
      border-color: var(--accent);
    }

    .remove-btn {
      padding: 4px 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-sub);
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s;
    }

    .remove-btn:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: background 0.15s;
    }

    button:hover {
      background: var(--border);
    }

    #save-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    #save-btn:hover {
      opacity: 0.9;
    }

    #add-btn {
      flex: 1;
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 12px;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <h1>나무위키 아카링커 설정</h1>
  <p class="subtitle">검색어 클릭 시 연결할 사이트를 커스텀합니다.</p>

  <div class="section-title">링크 대상 사이트</div>
  <p class="hint">URL에서 <strong>{keyword}</strong> 위치에 검색어가 삽입됩니다. 예: https://example.com/search?q={keyword}</p>

  <div id="sites-list"></div>

  <div class="actions">
    <button id="add-btn">+ 사이트 추가</button>
    <button id="reset-btn">기본값으로</button>
    <button id="save-btn">저장</button>
  </div>

  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
